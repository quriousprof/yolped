[package]
name = "yolped"
version = "0.1.1"
description = "A rust based deployment control panel"
authors = ["Soham Ghugare <soham.ghugare@gmail.com>"]
license = "MIT"
categories = ["development-tools"]
repository = "https://github.com/quriousprof/yolped"
edition = "2024"
readme = "../README.md"

[[bin]]
name = "yolped"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
dirs = "5"
rpassword = "7"
ssh2 = "0.9"
colored = "2"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "^4.5", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
random_word = { version = "0.5.2", features = ["en"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
