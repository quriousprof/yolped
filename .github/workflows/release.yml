name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── 1. Parse the commit message and decide if this is a release ──────────
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      should_release: ${{ steps.parse.outputs.should_release }}
    steps:
      - name: Parse commit message
        id: parse
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -qE '^bump:.*v[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION=$(echo "$MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  # ── 2. Create and push the git tag ───────────────────────────────────────
  tag:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.check.outputs.version }}
          git push origin ${{ needs.check.outputs.version }}

  # ── 3. Build binaries for all platforms ──────────────────────────────────
  build:
    needs: [check, tag]
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: yolped-linux-amd64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: yolped-linux-arm64
            use_cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            asset: yolped-darwin-amd64

          - os: macos-latest
            target: aarch64-apple-darwin
            asset: yolped-darwin-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: yolped-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Install cross
        if: ${{ matrix.use_cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross (Linux ARM64)
        if: ${{ matrix.use_cross }}
        working-directory: cli
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: cp cli/target/${{ matrix.target }}/release/yolped ${{ matrix.asset }}

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item cli/target/${{ matrix.target }}/release/yolped.exe ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # ── 4. Create GitHub Release and attach all binaries ─────────────────────
  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: ${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: |
            yolped-linux-amd64
            yolped-linux-arm64
            yolped-darwin-amd64
            yolped-darwin-arm64
            yolped-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Publish to crates.io ───────────────────────────────────────────────
  publish:
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        working-directory: cli
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
